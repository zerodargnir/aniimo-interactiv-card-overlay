[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aniimo-overlay"
version = "0.1.0"
description = "Desktop overlay showing the aniimotools.dev Lost Sanctum map over the Aniimo game"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "mss>=9.0",
    "opencv-python-headless>=4.8",
    "numpy>=1.26",
    "pynput>=1.7.6",
    "tomli-w>=1.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pyinstaller>=6.5"]

[project.scripts]
aniimo-overlay = "aniimo_overlay.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aniimo_overlay = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["packaging/*.spec"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/aniimo_overlay/gui/*" = ["E501"]
