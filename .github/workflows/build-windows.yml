name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ruff check .
          pytest -q

      - name: Build exe
        run: pyinstaller --noconfirm --clean packaging/AniimoOverlay.spec

      - name: Check QtWebEngine files in the exe
        run: python packaging/check_exe.py dist/AniimoOverlay.exe

      - uses: actions/upload-artifact@v4
        with:
          name: AniimoOverlay
          path: dist/AniimoOverlay.exe
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AniimoOverlay.exe
